name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-portfolio
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Deploy AWS Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # 1. Checkout the Terraform infrastructure repository
      - name: Checkout Terraform Repository
        uses: actions/checkout@v4

      # 2. Checkout the portfolio website repository
      - name: Checkout Portfolio Website
        uses: actions/checkout@v4
        with:
          repository: praveen520310/Paul-Praveen-devsecops-portfolio
          path: website

      # 3. Configure the S3 profile image URL
      - name: Configure S3 Profile Image URL
        run: |
          sed -i \
            's|src="profile.jpg"|src="https://praveen-devsecops-portfolio-2026-s3.s3.ap-south-1.amazonaws.com/profile.jpg"|' \
            website/index.html

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      # 5. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-terraform
          aws-region: ap-south-1

      # 6. Initialize Terraform
      - name: Terraform Initialize
        run: terraform init

      # 7. Validate the Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # 8. Generate and save the Terraform plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 9. Apply the saved Terraform plan
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan