name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      previous_run_id:
        description: "Previous successful Apply run ID (leave blank for first deployment)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: terraform-portfolio
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Deploy AWS Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Terraform Repository
        uses: actions/checkout@v4

      - name: Checkout Portfolio Website
        uses: actions/checkout@v4
        with:
          repository: praveen520310/Paul-Praveen-devsecops-portfolio
          path: website

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Restore Previous Terraform State
        if: ${{ inputs.previous_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: terraform-state-${{ inputs.previous_run_id }}
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}

      - name: Verify Restored State
        if: ${{ inputs.previous_run_id != '' }}
        run: |
          test -s terraform.tfstate
          terraform state list

      - name: Terraform Initialize
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Save Terraform State Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-${{ github.run_id }}
          path: terraform.tfstate
          if-no-files-found: error
          retention-days: 90